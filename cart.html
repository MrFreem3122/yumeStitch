<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Cart - Yume Stitch</title>
  <link rel="stylesheet" href="style_css/main.css">
</head>
<body>

 
  <header>
    <nav class="navbar">
      <div class="navbar-container">
        <div class="box-logo"><img src="images/Yume_Stich_Logo.png" alt="Logo"></div>
      </div>
      <ul class="navbar-menu">
        <li><a href="_index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <div class="navbar-container1"><div class="box-basket"><img src="images/basketIcon.png" alt="Basket icon"></div></div>
    </nav>
  </header>
<div class="cart">
  <h2 class="cart-title"> Your cart</h2>
   <div class="cart-content">
     <div class="cart-box">
      <img src="images/GokuBlack_sweater.png" alt="" class="cart-img">
      <div class="cart-detail">
        <h2 class="cart-product-title">Hoodie Goku</h2>
        <span class="cart-price">R300</span>
        <div class="cart-quantity">
          <button id="decrement">-</button>
          <span class="number">1</span>
          <button id="increment">+</button>
        </div>
      </div>
      <img src="images/delete-icon.png" alt="delete-icon" class="cart-remover">
     </div>
   </div>
   <div class="total">
    <div class="total-title">Total</div>
    <div class="total-price">R0</div>
   </div>
   <button class="btn-clear">Check Out Now </button>
   <img src="images/close-icon.png" alt="close-icone" class="close-icon">
</div>
  <main style="padding:2rem;">
    <h1>Votre panier</h1>
    <div id="cartRoot"></div>
  </main>

 
  <footer class="footer">
  <div class="footer-container">
    <section class="footer-logo">
      <div class="box-logo">
        <img src="images/Yume_Stich_Logo.png" alt="YUME Stitch Logo">
      </div>
    </section>

    <section class="footer-column">
      <h3>Categories</h3>
      <ul>
        <li><a href="shop-tshirts.html" class="links">T-shirts</a></li>
        <li><a href="shop-hoodies.html" class="links">Hoodies</a></li>
        <li><a href="shop-sweaters.html" class="links">Sweaters</a></li>
        <li><a href="shop-totebags.html" class="links">Tote-Bags</a></li>
      </ul>
    </section>

    <section class="footer-column">
      <h3>Navigation</h3>
      <ul>
        <li><a href="index.html" class="links">Home</a></li>
        <li><a href="about.html" class="links">About</a></li>
        <li><a href="contact.html" class="links">Contact</a></li>
      </ul>
    </section>

    <section class="footer-column">
      <h3>Quick Links</h3>
      <ul>
        <li><a href="cart.html" class="links">Cart</a></li>
      </ul>
    </section>
  </div>

  <div class="footer-bottom">
    &copy; ST10497592 - YUME Stitch
  </div>
</footer>
  <script type="module" src="script_Java/all.js"></script>
<script type="module" src="script_Java/cart.js"></script>
</body>
</html>
